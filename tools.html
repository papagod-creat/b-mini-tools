<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小工具集 · Mini Tools</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#22283a; --muted:#7a8199; --accent:#4f6ef7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--ink); min-height:100vh; padding:24px 16px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border-radius:14px; padding:20px; margin-bottom:16px;
          box-shadow:0 2px 10px rgba(30,40,90,.06); }
  .card h2 { font-size:16px; margin-bottom:12px; }
  input, select, button { font:inherit; }
  input[type=text], input[type=number], select {
    width:100%; padding:10px 12px; border:1px solid #d8dce8; border-radius:8px; margin:6px 0 12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:9px 18px; cursor:pointer; }
  button.ghost { background:#eef1f8; color:var(--ink); }
  .out { font-size:20px; font-weight:600; color:var(--accent); min-height:28px; word-break:break-all; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .muted { color:var(--muted); font-size:12px; margin-top:8px; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧰 小工具集</h1>
  <p class="sub">单文件 · 零依赖 · 数据不出浏览器</p>

  <div class="card">
    <h2>⏱ 倒计时</h2>
    <div class="row">
      <input type="number" id="cd-min" min="0" value="5" placeholder="分钟">
      <input type="number" id="cd-sec" min="0" max="59" value="0" placeholder="秒">
    </div>
    <button onclick="cdStart()">开始</button>
    <button class="ghost" onclick="cdStop()">停止</button>
    <p class="out" id="cd-out">05:00</p>
    <p class="muted">结束后标题栏闪烁提醒。</p>
  </div>

  <div class="card">
    <h2>📐 单位换算</h2>
    <input type="number" id="uc-in" value="1" oninput="ucRun()">
    <select id="uc-kind" onchange="ucRun()">
      <option value="km">公里 → 英里</option>
      <option value="kg">公斤 → 磅</option>
      <option value="c">摄氏度 → 华氏度</option>
      <option value="mb">兆字节 → 吉字节</option>
    </select>
    <p class="out" id="uc-out">—</p>
  </div>

  <div class="card">
    <h2>🔤 字符统计</h2>
    <textarea id="cc-in" rows="4" placeholder="粘贴文本…" style="width:100%;padding:10px;border:1px solid #d8dce8;border-radius:8px" oninput="ccRun()"></textarea>
    <p class="out" id="cc-out">0 字符 · 0 词</p>
    <p class="muted">中文按单字计，英文按单词计。</p>
  </div>

  <footer>MIT License · papagod-creat</footer>
</div>
<script>
// ---- 倒计时 ----
var cdTimer = null, cdLeft = 0;
function cdFmt(n) { return (n<10?'0':'') + n; }
function cdRender() {
  document.getElementById('cd-out').textContent =
    cdFmt(Math.floor(cdLeft/60)) + ':' + cdFmt(cdLeft%60);
}
function cdStart() {
  cdStop();
  cdLeft = parseInt(document.getElementById('cd-min').value||'0')*60
         + parseInt(document.getElementById('cd-sec').value||'0');
  if (cdLeft <= 0) return;
  cdRender();
  cdTimer = setInterval(function () {
    cdLeft--;
    cdRender();
    if (cdLeft <= 0) {
      cdStop();
      document.title = '⏰ 时间到！';
      setTimeout(function(){ document.title = '小工具集 · Mini Tools'; }, 4000);
    }
  }, 1000);
}
function cdStop() { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } }

// ---- 单位换算 ----
function ucRun() {
  var v = parseFloat(document.getElementById('uc-in').value);
  if (isNaN(v)) { document.getElementById('uc-out').textContent = '—'; return; }
  var k = document.getElementById('uc-kind').value, r, unit;
  if (k === 'km') { r = v * 0.621371; unit = 'mi'; }
  else if (k === 'kg') { r = v * 2.20462; unit = 'lb'; }
  else if (k === 'c') { r = v * 9/5 + 32; unit = '°F'; }
  else { r = v / 1024; unit = 'GB'; }
  document.getElementById('uc-out').textContent =
    Math.round(r * 10000) / 10000 + ' ' + unit;
}
ucRun();

// ---- 字符统计 ----
function ccRun() {
  var s = document.getElementById('cc-in').value;
  var cjk = (s.match(/[\u4e00-\u9fff]/g) || []).length;
  var en = (s.match(/[A-Za-z0-9]+/g) || []).length;
  document.getElementById('cc-out').textContent =
    s.length + ' 字符 · ' + (cjk + en) + ' 词';
}
</script>
</body>
</html>
